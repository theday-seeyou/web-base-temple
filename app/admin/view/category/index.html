{extend name='table'}

{block name="button"}
{if isset($type) and $type eq 'index'}
<!--{if auth("add")}-->
<button data-modal='{:url("add")}' data-table-id="CategoryTable" class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('添加分类')}</button>
<!--{/if}-->

<!--{if auth("state")}-->
<button data-action='{:url("state")}' data-table-id="CategoryTable" data-rule="id#{sps};status#0" class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('禁用分类')}</button>
<!--{/if}-->
<!--{if auth("remove")}-->
<button data-action='{:url("remove")}' data-table-id="CategoryTable" data-rule="id#{sps}" data-confirm="{:lang('确定要将选中分类移入回收站吗？')}" class='layui-btn layui-btn-sm layui-btn-danger'>{:lang('批量删除')}</button>
<!--{/if}-->
{else}
<!--{if auth("restore")}-->
<button data-action='{:url("restore")}' data-table-id="CategoryTable" data-rule="id#{id}" data-confirm="{:lang('确定要恢复选中栏目吗？')}" class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('批量恢复')}</button>
<!--{/if}-->
<!--{if auth("destroy")}-->
<button data-action='{:url("destroy")}' data-table-id="CategoryTable" data-rule="id#{id}" data-confirm="{:lang('永久删除后无法恢复，确定继续吗？')}" class='layui-btn layui-btn-sm layui-btn-danger'>{:lang('永久删除')}</button>
<!--{/if}-->
{/if}
{/block}

{block name="content"}
<div class="layui-tab layui-tab-card">
    <ul class="layui-tab-title">
        <li class="{if isset($type) and $type eq 'index'}layui-this{/if}" data-open="{:url('index')}?type=index">{:lang('栏目列表')}</li>
        <li class="{if isset($type) and $type eq 'recycle'}layui-this{/if}" data-open="{:url('index')}?type=recycle">{:lang('回 收 站')}</li>
    </ul>
    <div class="layui-tab-content">
        <table id="CategoryTable" data-url="{:url('index')}" data-target-search="form.form-search"></table>
    </div>
</div>

<script>
    $(function () {
        $('#CategoryTable').layTable({
            even: true,
            height: 'full',
            page: false,
            where: {type: '{$type|default="index"}'},
            sort: {field: 'sort asc,id', type: 'asc'},
            cols: [[
                {checkbox: true, field: '{if isset($type) and $type eq "index"}sps{else}id{/if}'},
                {field: 'sort', title: {:json_encode(lang('排序'), 15)}, width: 100, align: 'center'{if isset($type) and $type eq 'index'}, templet: '#SortInputTpl'{/if}},
                {field: 'icon', title: {:json_encode(lang('图标'), 15)}, width: 80, align: 'center', templet: function(d){return d.icon ? '<i class="'+d.icon+' font-s18"></i>' : '-';}},
                {field: 'title', title: {:json_encode(lang('栏目名称'), 15)}, minWidth: 220, templet: '<div><span class="color-desc">{{d.spl}}</span>{{d.title}}</div>'},
                {field: 'cover', title: {:json_encode(lang('封面图'), 15)}, width: 100, align: 'center', templet: '#CoverTpl'},
                {field: 'status', title: {:json_encode(lang('状态'), 15)}, width: 120, align: 'center'{if isset($type) and $type eq 'index'}, templet: '#StatusSwitchTpl'{/if}},
                {if isset($type) and $type eq 'recycle'}{field: 'deleted_at', title: {:json_encode(lang('删除时间'), 15)}, width: 180, align: 'center', sort: true},{/if}
                {toolbar: '#toolbar', title: {:json_encode(lang('操作'), 15)}, width: 200, align: 'center', fixed: 'right'},
            ]]
        });

        // 数据状态切换操作
        layui.form.on('switch(StatusSwitch)', function (object) {
            object.data = {status: object.elem.checked > 0 ? 1 : 0};
            object.data.id = object.value.split('|')[object.data.status] || object.value;
            $.form.load("{:url('state')}", object.data, 'post', function (ret) {
                if (ret.code < 1) $.msg.error(ret.info, 3, function () {
                    $('#CategoryTable').trigger('reload');
                }); else {
                    $('#CategoryTable').trigger('reload');
                }
                return false;
            }, false);
        });
    });
</script>

<!-- 封面图模板 -->
<script type="text/html" id="CoverTpl">
    {{# if(d.cover){ }}
    <img src="{{d.cover}}" style="max-height:32px;max-width:60px;">
    {{# }else{ }}
    -
    {{# } }}
</script>

<!-- 数据状态切换模板 -->
<script type="text/html" id="StatusSwitchTpl">
    <!--{if auth("state")}-->
    <input type="checkbox" value="{{d.sps}}|{{d.spp}}" lay-text="{:lang('已激活')}|{:lang('已禁用')}" lay-filter="StatusSwitch" lay-skin="switch" {{-d.status>0?'checked':''}}>
    <!--{else}-->
    {{-d.status ? '<b class="color-green">{:lang('已激活')}</b>' : '<b class="color-red">{:lang('已禁用')}</b>'}}
    <!--{/if}-->
</script>

<!-- 列表排序权重模板 -->
<script type="text/html" id="SortInputTpl">
    <input type="number" min="0" data-blur-number="0" data-action-blur="{:sysuri()}" data-value="id#{{d.id}};action#sort;sort#{value}" data-loading="false" value="{{d.sort}}" class="layui-input text-center">
</script>

<!-- 操控面板的模板 -->
<script type="text/html" id="toolbar">
    {if isset($type) and $type eq 'index'}
    <!--{if auth("add")}-->
    {{# if(d.spt < 2){ }}
    <a class="layui-btn layui-btn-sm layui-btn-primary" data-title="{:lang('添加子栏目')}" data-modal='{:url("add")}?pid={{d.id}}'>{:lang('添加')}</a>
    {{# }else{ }}
    <a class="layui-btn layui-btn-sm layui-btn-disabled">{:lang('添加')}</a>
    {{# } }}
    <!--{/if}-->

    <!--{if auth("edit")}-->
    <a class="layui-btn layui-btn-sm" data-event-dbclick data-title="{:lang('编辑栏目')}" data-modal='{:url("edit")}?id={{d.id}}'>{:lang('编辑')}</a>
    <!--{/if}-->

    <!--{if auth("remove")}-->
    <a class="layui-btn layui-btn-sm layui-btn-danger" data-confirm="{:lang('确定要删除该栏目吗？')}" data-action="{:url('remove')}" data-value="id#{{d.sps}}">{:lang('删除')}</a>
    <!--{/if}-->
    {else}
    <!--{if auth("restore")}-->
    <a class="layui-btn layui-btn-sm" data-confirm="{:lang('确定要恢复该栏目吗？')}" data-action="{:url('restore')}" data-value="id#{{d.id}}">{:lang('恢复')}</a>
    <!--{/if}-->
    <!--{if auth("destroy")}-->
    <a class="layui-btn layui-btn-sm layui-btn-danger" data-confirm="{:lang('永久删除后无法恢复，确定继续吗？')}" data-action="{:url('destroy')}" data-value="id#{{d.id}}">{:lang('永久删除')}</a>
    <!--{/if}-->
    {/if}
</script>
{/block}
