{extend name='table'}

{block name="button"}
{if isset($scope) and $scope eq 'index'}
<!--{if auth("add")}-->
<button data-table-id="BaseTable" data-modal='{:url("add")}?type={$type|default=""}' class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('添加数据')}</button>
<!--{/if}-->

<!--{if auth("remove")}-->
<button data-table-id="BaseTable" data-action='{:url("remove")}' data-rule="id#{id}" data-confirm="{:lang('确定要批量删除数据吗？')}" class='layui-btn layui-btn-sm layui-btn-primary'>{:lang('批量删除')}</button>
<!--{/if}-->
{else}
<!--{if auth("restore")}-->
<button data-table-id="BaseTable" data-action='{:url("restore")}' data-rule="id#{id}" data-confirm="确定要恢复选中的数据吗？" class='layui-btn layui-btn-sm layui-btn-primary'>批量恢复</button>
<!--{/if}-->
<!--{if auth("destroy")}-->
<button data-table-id="BaseTable" data-action='{:url("destroy")}' data-rule="id#{id}" data-confirm="永久删除后无法恢复，确定继续吗？" class='layui-btn layui-btn-sm layui-btn-danger'>永久删除</button>
<!--{/if}-->
{/if}
{/block}

{block name="content"}
<div class="layui-tab layui-tab-card">
    <ul class="layui-tab-title">
        <li class="{if isset($scope) and $scope eq 'index'}layui-this{/if}" data-open="{:url('index')}?scope=index">正常数据</li>
        <li class="{if isset($scope) and $scope eq 'recycle'}layui-this{/if}" data-open="{:url('index')}?scope=recycle">回 收 站</li>
    </ul>
    <div class="layui-tab-content">
        <div class="margin-bottom-10">
            {foreach $types as $t}
            <a data-open="{:url('index')}?scope={$scope|default='index'}&type={$t}" class="layui-btn layui-btn-sm {if isset($type) and $type eq $t}layui-btn-normal{else}layui-btn-primary{/if}">{$t}</a>
            {/foreach}
        </div>
        {include file='base/index_search'}
        <table id="BaseTable" data-url="{:request()->url()}" data-target-search="form.form-search"></table>
    </div>
</div>
{/block}

{block name='script'}
<script>
    $(function () {
        // 初始化表格组件
        $('#BaseTable').layTable({
            even: true, height: 'full',
            sort: {field: 'sort desc,id', type: 'asc'},
            where: {scope: '{$scope|default="index"}', type: '{$type|default=""}'},
            cols: [[
                {checkbox: true, fixed: true},
                {field: 'sort', title: '{:lang("排序权重")}', width: 100, align: 'center', sort: true{if isset($scope) and $scope eq 'index'}, templet: '#SortInputTpl'{/if}},
                // {field: 'type', title: '数据类型', minWidth: 140, align: 'center'},
                {field: 'code', title: '{:lang("数据编码")}', width: '20%', align: 'left'},
                {field: 'name', title: '{:lang("数据名称")}', width: '30%', align: 'left'},
                {field: 'status', title: '{:lang("数据状态")}', minWidth: 110, align: 'center'{if isset($scope) and $scope eq 'index'}, templet: '#StatusSwitchTpl'{/if}},
                {if isset($scope) and $scope eq 'recycle'}{field: 'deleted_at', title: '删除时间', minWidth: 170, align: 'center', sort: true},{/if}
                {field: 'created_at', title: '{:lang("创建时间")}', minWidth: 170, align: 'center', sort: true},
                {toolbar: '#toolbar', align: 'center', minWidth: 150, title: '{:lang("数据操作")}', fixed: 'right'},
            ]]
        });

        // 数据状态切换操作
        layui.form.on('switch(StatusSwitch)', function (obj) {
            var data = {id: obj.value, status: obj.elem.checked > 0 ? 1 : 0};
            $.form.load("{:url('state')}", data, 'post', function (ret) {
                if (ret.code < 1) $.msg.error(ret.info, 3, function () {
                    $('#BaseTable').trigger('reload');
                });
                return false;
            }, false);
        });
    });
</script>

<!-- 列表排序权重模板 -->
<script type="text/html" id="SortInputTpl">
    <input type="number" min="0" data-blur-number="0" data-action-blur="{:sysuri()}" data-value="id#{{d.id}};action#sort;sort#{value}" data-loading="false" value="{{d.sort}}" class="layui-input text-center">
</script>

<!-- 数据状态切换模板 -->
<script type="text/html" id="StatusSwitchTpl">
    <!--{if auth("state")}-->
    <input type="checkbox" value="{{d.id}}" lay-skin="switch" lay-text="{:lang('已激活')}|{:lang('已禁用')}" lay-filter="StatusSwitch" {{-d.status>0?'checked':''}}>
    <!--{else}-->
    {{-d.status ? '<b class="color-green">{:lang("已启用")}</b>' : '<b class="color-red">{:lang("已禁用")}</b>'}}
    <!--{/if}-->
</script>

<!-- 数据操作工具条模板 -->
<script type="text/html" id="toolbar">
    {if isset($scope) and $scope eq 'index'}
    <!--{if auth('edit')}-->
    <a class="layui-btn layui-btn-primary layui-btn-sm" data-event-dbclick data-title="{:lang('编辑数据')}" data-modal='{:url("edit")}?id={{d.id}}'>{:lang('编 辑')}</a>
    <!--{/if}-->

    <!--{if auth("remove")}-->
    <a class="layui-btn layui-btn-danger layui-btn-sm" data-confirm="{:lang('确定要删除数据吗?')}" data-action="{:url('remove')}" data-value="id#{{d.id}}">{:lang('删 除')}</a>
    <!--{/if}-->
    {else}
    <!--{if auth('restore')}-->
    <a class="layui-btn layui-btn-primary layui-btn-sm" data-confirm="确定要恢复该数据吗？" data-action="{:url('restore')}" data-value="id#{{d.id}}">恢 复</a>
    <!--{/if}-->
    <!--{if auth('destroy')}-->
    <a class="layui-btn layui-btn-danger layui-btn-sm" data-confirm="永久删除后无法恢复，确定继续吗？" data-action="{:url('destroy')}" data-value="id#{{d.id}}">永久删除</a>
    <!--{/if}-->
    {/if}
</script>
{/block}
